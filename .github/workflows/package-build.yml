name: Build and Package

permissions:
  contents: read

on:
  push:
    branches: [ "main", "*/main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  config: Release
  out_folder: ./build-out/
  core_project: ./Our.Umbraco.MaintenanceMode.Core/Our.Umbraco.MaintenanceMode.Core.csproj
  client_project: ./Our.Umbraco.MaintenanceMode.Client/Our.Umbraco.MaintenanceMode.Client.csproj
  assets_project: ./Our.Umbraco.MaintenanceMode.Assets/Our.Umbraco.MaintenanceMode.Assets.csproj
  package_project: ./Our.Umbraco.MaintenanceMode/Our.Umbraco.MaintenanceMode.csproj
  client_folder: ./Our.Umbraco.MaintenanceMode.Client/maintenance-client

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_string: ${{ steps.gitversion.outputs.fullSemVer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        # pinned to v3 on purpose: v4 of this action requires GitVersion >= 6.2, and our
        # GitVersion.yml is still v5 schema (mode / tag rather than deployment-mode / label).
        # Moving to v4 means migrating that config too - see the dependabot ignore.
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "5.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: ./GitVersion.yml

      # block scalar, not a plain one - the ": " inside the string would otherwise be
      # read as the start of a nested mapping.
      - name: Display version
        run: |
          echo "Full Version: ${{ steps.gitversion.outputs.fullSemVer }}"

  package-up:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: install client dependencies
        run: npm ci
        working-directory: ${{ env.client_folder }}

      # wwwroot/App_Plugins is gitignored, so without this the package ships with no
      # backoffice assets at all. it has to run before pack.
      - name: build client
        run: npm run build
        working-directory: ${{ env.client_folder }}

      # Core and Client are built explicitly, not just pulled in transitively via the
      # package project's ProjectReferences, so a break in either is attributed to the
      # right project and isn't masked by only ever building the package project.
      - name: restore core
        run: dotnet restore ${{ env.core_project }} --locked-mode

      - name: build core
        run: >
          dotnet build ${{ env.core_project }}
          -c ${{ env.config }} --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: restore client
        run: dotnet restore ${{ env.client_project }} --locked-mode

      - name: build client project
        run: >
          dotnet build ${{ env.client_project }}
          -c ${{ env.config }} --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: restore assets
        run: dotnet restore ${{ env.assets_project }} --locked-mode

      - name: build assets project
        run: >
          dotnet build ${{ env.assets_project }}
          -c ${{ env.config }} --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: restore
        run: dotnet restore ${{ env.package_project }} --locked-mode

      - name: build
        run: >
          dotnet build ${{ env.package_project }}
          -c ${{ env.config }} --no-restore
          -p:ContinuousIntegrationBuild=true

      # Our.Umbraco.MaintenanceMode.nuspec declares Core/Client/Assets as NuGet
      # dependencies at this same version (they're ordinary packable ProjectReferences,
      # not IsPackable=false), so all four have to be packed together for the artifact
      # produced here to reflect what release.yml would actually publish.
      #
      # deliberately not --no-build: the version has to be stamped onto the assembly as well
      # as the nuspec, so this step rebuilds with it.
      - name: pack core
        run: >
          dotnet pack ${{ env.core_project }}
          -c ${{ env.config }}
          --output ${{ env.out_folder }}
          /p:version=${{ needs.version.outputs.version_string }}
          -p:ContinuousIntegrationBuild=true

      - name: pack client
        run: >
          dotnet pack ${{ env.client_project }}
          -c ${{ env.config }}
          --output ${{ env.out_folder }}
          /p:version=${{ needs.version.outputs.version_string }}
          -p:ContinuousIntegrationBuild=true

      - name: pack assets
        run: >
          dotnet pack ${{ env.assets_project }}
          -c ${{ env.config }}
          --output ${{ env.out_folder }}
          /p:version=${{ needs.version.outputs.version_string }}
          -p:ContinuousIntegrationBuild=true

      - name: package
        run: >
          dotnet pack ${{ env.package_project }}
          -c ${{ env.config }}
          --output ${{ env.out_folder }}
          /p:version=${{ needs.version.outputs.version_string }}
          -p:ContinuousIntegrationBuild=true

      # NOTE: intentionally no `dotnet nuget push` here - this workflow builds a package
      # for review on every push to the release branch and does not release. That happens in
      # release.yml, triggered by pushing a v{version} tag.
      - name: Upload nuget package as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-build-output
          path: ${{ env.out_folder }}
